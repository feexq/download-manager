<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Button Extension</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="popup-container">
    <h1>Введіть або Перетягніть URL</h1>
    <input type="text" id="urlInput" placeholder="Введіть URL">
    <button id="sendButton">Надіслати</button>
    <div id="statusMessage"></div>
    <p>Перетягніть URL на веб-сторінку, щоб завантажити.</p>
</div>
<script src="popup.js"></script>
</body>
</html>
