name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Make maven wrapper executable
      if: runner.os != 'Windows'
      run: chmod +x mvnw

    - name: Build with Maven Wrapper
      run: ./mvnw -B clean install --file pom.xml
      shell: bash
      
    - name: Verify P2P Server startup
      run: |
        java -cp target/DownloadManager-1.0-SNAPSHOT.jar com.project.downloadmanager.ServerStart &
        SERVER_PID=$!
        sleep 10
        if ps -p $SERVER_PID > /dev/null; then
           echo "P2P Server started successfully and is running."
           kill $SERVER_PID
        else
           echo "P2P Server failed to start or crashed."
           exit 1
        fi
      shell: bash

    - name: Install xvfb (Linux only)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y xvfb

    - name: Verify Download Manager App startup
      run: |
        if [ "$RUNNER_OS" == "Linux" ]; then
          xvfb-run --auto-servernum ./mvnw javafx:run &
        else
          ./mvnw javafx:run &
        fi
        APP_PID=$!
        echo "Waiting for app to initialize..."
        sleep 20
        if ps -p $APP_PID > /dev/null; then
           echo "Download Manager App started successfully."
           kill -9 $APP_PID || true
        else
           echo "Download Manager App failed to start."
           exit 1
        fi
      shell: bash
